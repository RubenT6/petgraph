[package]
name                   = "petgraph-core"
version                = "0.1.0"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
# We can remove this this crate has been released at least once
publish = false

[dependencies]
fixedbitset = { workspace = true }
foldhash    = { workspace = true, optional = true }
hashbrown   = { workspace = true, optional = true }
proptest    = { version = "1.12.0", default-features = false, features = ["no_std", "alloc", "unstable"], optional = true }

[features]
default   = ["std"]
std       = ["alloc"]
alloc     = []
hashbrown = ["dep:hashbrown"]

# For testing
test-utils = ["dep:foldhash", "hashbrown", "alloc", "dep:proptest"]

[lints]
workspace = true
